[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "label_ai"
version = "1.0.0"
description = "Local, open-weight AI inference server (selection, matting, inpainting, generation, editing) for the label editor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "diffusers>=0.35",
    "accelerate>=0.33",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "timm>=1.0",
    "einops>=0.8",
    "kornia>=0.7",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
label-ai = "label_ai.__main__:main"

[tool.setuptools]
packages = ["label_ai", "label_ai.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
